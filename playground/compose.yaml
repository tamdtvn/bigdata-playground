services:
  postgres:
    image: postgres:18
    
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: playground

    volumes:
      - postgres-data:/var/lib/postgresql

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d playground"]
      interval: 5s
      timeout: 5s
      retries: 5

  ingestion:
    build:
      context: ../services/ingestion

    volumes:
      - ../datasets:/data:ro

    depends_on:
      postgres:
        condition: service_healthy

  processing:
    build:
      context: ../services/processing

    volumes:
      - ../datasets:/data:ro
      - ../datasets/processed:/output
      - ../data/lake/raw:/lake/raw:ro
      - ../data/lake/cleaned:/lake/cleaned
      - ../data/lake/curated:/lake/curated

  data-generator:
    image: python:3.13
    working_dir: /scripts
    volumes:
      - ../scripts:/scripts:ro
      - ../datasets:/output
    command: python generate_partition_orders.py

  spark:
    image: apache/spark:4.0.1
    volumes:
      - ../data:/data
      - ../services/spark:/app
    working_dir: /app  

  airflow:
    build:
      context: ../services/airflow
    command: standalone
    ports:
      - "8080:8080"
    volumes:
      - ../services/airflow/dags:/opt/airflow/dags
      - ../services/processing:/processing:ro
      - ../data/lake/raw:/lake/raw:ro
      - ../data/lake/cleaned:/lake/cleaned
      - ../data/lake/curated:/lake/curated
      - airflow_data:/opt/airflow

volumes:
  postgres-data:
  airflow_data: