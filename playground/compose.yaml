services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: playground
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d playground"]
      interval: 5s
      timeout: 5s
      retries: 5

  ingestion:
    build:
      context: ../services/ingestion
    volumes:
      - ../datasets:/data:ro
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres-data: